<div class="wn-host">
  <article class="ui-card wn" anvil:dom-node="card">
    <div class="ui-row"><span class="ui-badge brand" anvil:dom-node="channel"></span><span class="ui-badge" anvil:dom-node="btype"></span><span class="ui-badge warn" anvil:dom-node="demo" title="Made up to show the format">Example</span><span class="ui-badge bad" anvil:dom-node="hid">Hidden</span></div>
    <h3 anvil:dom-node="title"></h3>
    <p class="story" anvil:dom-node="story"></p>
    <div class="res" anvil:dom-node="res"><i class="ic ic-trophy"></i><span anvil:dom-node="result"></span></div>
    <div class="wn-foot"><span anvil:dom-node="by"></span><span class="ui-spacer"></span>
      <anvil-component type="Button" name="clap_button" prop:role='["btn", "btn-sm", "wn-clap", "ic-clap"]'></anvil-component>
      <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["btn", "btn-ghost", "btn-icon", "btn-sm", "ic-trash"]'></anvil-component>
    </div>
  </article>
</div>
